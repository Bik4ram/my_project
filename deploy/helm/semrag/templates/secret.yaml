{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "semrag.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "semrag.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.POSTGRES_PASSWORD | quote }}
  SEMRAG_API_KEYS: {{ .Values.secret.SEMRAG_API_KEYS | quote }}
  SEMRAG_LLM_API_KEY: {{ .Values.secret.SEMRAG_LLM_API_KEY | quote }}
  SEMRAG_EMBEDDING_API_KEY: {{ .Values.secret.SEMRAG_EMBEDDING_API_KEY | quote }}
{{- end }}