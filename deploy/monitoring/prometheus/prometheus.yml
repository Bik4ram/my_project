# Prometheus server configuration for SemRAG (Wave 3).
#
# Scrape the API and worker pods every 15s (matches the recording
# interval of `semrag_http_request_duration_seconds` etc.). The
# `semrag_*` metrics emitted by the application are scraped via the
# `/metrics` endpoint, set up by `core/metrics.py`.
#
# Rules and alerting are split out into `rules/` and `alertmanager.yml`
# so an operator can rotate them independently of the scrape config.
#
# Production rollout checklist:
# 1. Replace `targets: ['semrag-api:8000']` with the actual
#    Kubernetes service DNS or pod IPs from the Helm chart.
# 2. Mount `alertmanager.yml` and `rules/*.yml` into the Prometheus
#    container (see docker-compose.override for the dev path).
# 3. Point `alerting:` at the Alertmanager URL exposed by the
#    Alertmanager StatefulSet.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: semrag-dev

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # SemRAG API — application metrics (HTTP, RAG, indexing, jobs).
  - job_name: semrag-api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "semrag-api:8000"
        labels:
          service: semrag
          component: api

  # SemRAG worker — same /metrics endpoint when running as a separate
  # pod. Today SemRAG runs API + worker in the same process; the
  # scrape config covers both shapes so a future split (e.g. running
  # the worker as a Job) needs no config change here.
  - job_name: semrag-worker
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "semrag-worker:8000"
        labels:
          service: semrag
          component: worker

  # Prometheus self-scrape — keeps `up{}` series visible.
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"
