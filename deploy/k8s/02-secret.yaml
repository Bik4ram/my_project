# Secret template. The values below are placeholders — never commit
# real secrets. Create the real Secret with:
#
#   kubectl create secret generic semrag-secrets -n semrag \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=SEMRAG_API_KEYS=key1,key2
#
# Or with Kustomize: edit this file in your fork and patch the
# `secretGenerator:` block. The Deployment reads these via
# `valueFrom.secretKeyRef`.

---
apiVersion: v1
kind: Secret
metadata:
  name: semrag-secrets
  namespace: semrag
  labels:
    app.kubernetes.io/name: semrag
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Postgres password — must match the password in the postgres Secret.
  POSTGRES_PASSWORD: "REPLACE_ME"

  # Comma-separated API keys accepted by the API. At least one
  # non-default key is required when SEMRAG_ENVIRONMENT=production
  # (enforced by SemRAG's startup validation).
  SEMRAG_API_KEYS: "REPLACE_ME"

  # Optional: API key for hosted LLM providers. Empty for Ollama.
  SEMRAG_LLM_API_KEY: ""

  # Optional: API key for hosted embedding providers.
  SEMRAG_EMBEDDING_API_KEY: ""